[global]
leapfile /usr/share/zoneinfo/leap-seconds.list

# NMEA input from the GPS (your socat-created PTY)
ts2phc.nmea_serialport /dev/gps-ts2phc

[eth1]
# eth1 PHC is the PPS sink from the GPS
ts2phc.extts_polarity rising
ts2phc.channel 0
ts2phc.pin_index 2
# PPS input delay: on one unit, the i226 SDP0 PPS lagged the GPS PPS by 26 ns
# on a scope (1 h mean, 2026-11-10), so the PPS timestamps are 26 ns late. This
# includes any i226 PPS output delay. Re-measure on other boards.
ts2phc.extts_correction -26
