#
# Automotive Profile example configuration for server containing those
# attributes which differ from the defaults.  See the file, default.cfg, for
# the complete list of available options.
#
# Added grandmaster-specific settings to the end of the file, which are applied via
# the pmc command in the ptp4l-gm.service file.  This is necessary to ensure that the
# grandmaster settings are applied even if the BMCA is disabled (as it is here).
#
# Ordered by IEEE 802.1AS clause 14 data sets. Commented lines match the ADIN6310 but are
# either the ptp4l default or have no linuxptp 4.0 option.
#
[global]
#
# 14.2 defaultDS
#
clockClass              6
clockAccuracy           0x21
offsetScaledLogVariance 0x4e5d
priority1               1
priority2               1
gmCapable               1
timeSource              0x20
#domainNumber           0

#
# 14.8 portDS
#
delay_mechanism         P2P
neighborPropDelayThresh 800
#delayAsymmetry         0
logAnnounceInterval     0
#announceReceiptTimeout 3
logSyncInterval         -3
syncReceiptTimeout      3
#logMinPdelayReqInterval 0
#msg_interval_request   0
#initialLogGptpCapableMessageInterval 0
#allowedLostResponses   9
#allowedFaults          9
#gPtpCapableReceiptTimeout 9
#twoStepFlag            1

#
# Transport and implementation (no 802.1AS data-set member)
#
transportSpecific       1
ptp_dst_mac             01:80:C2:00:00:0E
network_transport       L2
path_trace_enabled      1
follow_up_info          1
assume_two_step         1
min_neighbor_prop_delay -20000000

#
# Automotive Profile specific options
#
# Commenting out because this caused a conflict with the Raspberry Pi OS
BMCA                    noop
#inhibit_announce        1
#asCapable               true
#inhibit_delay_req       1
serverOnly              1
leapfile                /usr/share/zoneinfo/leap-seconds.list
